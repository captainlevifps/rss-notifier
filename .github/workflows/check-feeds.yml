name: Check RSS Feeds

on:
  schedule:
    - cron: "*/5 * * * *"    # كل 5 دقايق (أقل حاجة GitHub بيسمح بيها فعليًا)، 24/7
  workflow_dispatch: {}       # يسمحلك تشغله يدوي من تبويب Actions للتجربة

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check
        env:
          F1_WEBHOOK: ${{ secrets.F1_WEBHOOK }}
          MARVEL_RIVALS_WEBHOOK: ${{ secrets.MARVEL_RIVALS_WEBHOOK }}
          TECH_AI_WEBHOOK: ${{ secrets.TECH_AI_WEBHOOK }}
          JOBS_EGYPT_WEBHOOK: ${{ secrets.JOBS_EGYPT_WEBHOOK }}
          JOBS_EGYPT_ALERT_URL: ${{ secrets.JOBS_EGYPT_ALERT_URL }}
        run: python check_feeds.py

      - name: Commit updated seen.json
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "update seen items [skip ci]"
          git push
