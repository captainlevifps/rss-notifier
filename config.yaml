# =========================================================================
#  عدّل هنا بس. كل feed = قناة واحدة على Discord.
#
#  webhook: حط اسم الـ GitHub Secret مسبوق بـ $  (متكتبش اللينك هنا صريح لو الريبو public)
#  mention: اختياري. سيبها فاضية "" لو مش عايز تاج حد.
#           رول:    "<@&ROLE_ID>"
#           شخص:    "<@USER_ID>"
#           الكل:   "@everyone"
#  label:   اسم المصدر اللي هيظهر فوق الخبر جوه الـ embed (مثلاً "Autosport")
#  color:   لون شريط الـ embed، هيكس بين قوسين "0xRRGGBB"
#  keywords: اختياري، لو حطيت كلمات، هيبعت بس الأخبار اللي عنوانها فيه واحدة منهم
# =========================================================================

feeds:
  # ---- F1: 3 مصادر على نفس القناة (نفس الـ webhook) - أحمر F1 ----
  - name: f1_news_autosport
    url: "https://www.autosport.com/rss/f1/news/"
    webhook: "$F1_WEBHOOK"
    mention: ""
    label: "Autosport"
    color: "0xE10600"

  - name: f1_news_motorsport
    url: "https://www.motorsport.com/rss/f1/news/"
    webhook: "$F1_WEBHOOK"
    mention: ""
    label: "Motorsport.com"
    color: "0xE10600"

  - name: f1_news_official
    url: "https://www.formula1.com/en/latest/all.xml"
    webhook: "$F1_WEBHOOK"
    mention: ""
    label: "Formula1.com (رسمي)"
    color: "0xE10600"

  # ---- Marvel Rivals: subreddit رئيسي + subreddit الـ leaks - بنفسجي مارفل ----
  - name: marvel_rivals_news
    url: "https://www.reddit.com/r/marvelrivals/new/.rss"
    webhook: "$MARVEL_RIVALS_WEBHOOK"
    mention: ""
    label: "r/marvelrivals"
    color: "0xED1D24"

  - name: marvel_rivals_leaks
    url: "https://www.reddit.com/r/MarvelRivalsLeaks/new/.rss"
    webhook: "$MARVEL_RIVALS_WEBHOOK"
    mention: ""
    label: "r/MarvelRivalsLeaks"
    color: "0xED1D24"

  # ---- Tech/AI: TechCrunch + The Verge + مصادر رسمية وتحريرية إضافية - أزرق ----
  - name: tech_ai_techcrunch
    url: "https://techcrunch.com/tag/artificial-intelligence/feed/"
    webhook: "$TECH_AI_WEBHOOK"
    mention: ""
    label: "TechCrunch"
    color: "0x0ABF53"

  - name: tech_ai_theverge
    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
    webhook: "$TECH_AI_WEBHOOK"
    mention: ""
    label: "The Verge"
    color: "0x5200FF"

  - name: tech_ai_openai
    url: "https://openai.com/news/rss.xml"
    webhook: "$TECH_AI_WEBHOOK"
    mention: ""
    label: "OpenAI (رسمي)"
    color: "0x10A37F"

  - name: tech_ai_marktechpost
    url: "https://www.marktechpost.com/feed/"
    webhook: "$TECH_AI_WEBHOOK"
    mention: ""
    label: "MarkTechPost"
    color: "0x1E90FF"

  - name: tech_ai_huggingface
    url: "https://huggingface.co/blog/feed.xml"
    webhook: "$TECH_AI_WEBHOOK"
    mention: ""
    label: "Hugging Face"
    color: "0xFFD21E"

  - name: tech_ai_mit
    url: "https://www.technologyreview.com/topic/artificial-intelligence/feed/"
    webhook: "$TECH_AI_WEBHOOK"
    mention: ""
    label: "MIT Technology Review"
    color: "0xA31F34"

  - name: tech_ai_google
