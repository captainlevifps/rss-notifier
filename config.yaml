    mention: ""
    label: "Google AI Blog"
    color: "0x4285F4"

  - name: tech_ai_hackernews
    url: "https://hnrss.org/newest?q=AI+OR+LLM"
    webhook: "$TECH_AI_WEBHOOK"
    mention: ""
    label: "Hacker News"
    color: "0xFF6600"

  - name: jobs_egypt
    # ده Google Alerts RSS - شوف الشرح في README.md ازاي تجيبه
    url: "$JOBS_EGYPT_ALERT_URL"
    webhook: "$JOBS_EGYPT_WEBHOOK"
    mention: "<@&ROLE_ID_HERE>"
    label: "LinkedIn Jobs (Egypt) - AI/ML/Data"
    color: "0x0A66C2"
    # فلتر احتياطي: أي عنوان بيحتوي واحدة من الكلمات دي بس هيتبعت
    # (الفلتر الأساسي بيحصل فعليًا في الـ query بتاع Google Alerts نفسه)
    keywords: ["ai", "machine learning", "ml ", "deep learning", "computer vision",
               "nlp", "data scientist", "data analyst", "data analysis",
               "automation", "agentic", "artificial intelligence"]

